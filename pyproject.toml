[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsm-memorization"
version = "0.1.0"
description = "DSM memorization detection experiments for diffusion models."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "accelerate>=0.27",
  "diffusers>=0.27",
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=10.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "transformers>=4.38",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
